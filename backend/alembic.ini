[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# env.py reads DATABASE_URL through app.database.get_database_url.
# Keep this placeholder non-secret; do not put real database URLs here.
sqlalchemy.url = sqlite:///./setpilot.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
